<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>{{.Title}} · fynanz</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><img class="brand-ico" src="/static/favicon.svg" alt=""> fynanz</a>
    <nav>
      <a href="/" {{if eq .ActiveNav "dashboard"}}class="active"{{end}}><span class="nav-full">Dashboard</span><span class="nav-short mono">Db</span></a>
      <a href="/transactions" {{if eq .ActiveNav "transactions"}}class="active"{{end}}><span class="nav-full">Transactions</span><span class="nav-short mono">Tx</span></a>
      <a href="/inbox" {{if eq .ActiveNav "inbox"}}class="active"{{end}}><span class="nav-full">Inbox</span><span class="nav-short mono">Ib</span>{{if .UncategorizedN}} <span class="badge-count" id="uncat-badge">{{.UncategorizedN}}</span>{{end}}</a>
      <a href="/categories" {{if eq .ActiveNav "categories"}}class="active"{{end}}><span class="nav-full">Categories</span><span class="nav-short mono">Ct</span></a>
      <a href="/notifications" {{if eq .ActiveNav "notifications"}}class="active"{{end}}><span class="nav-full">Notifications</span><span class="nav-short mono">Nt</span></a>
      <a href="/settings" {{if eq .ActiveNav "settings"}}class="active"{{end}}><span class="nav-full">Settings</span><span class="nav-short mono">St</span></a>
    </nav>
    <span class="count">{{.TxCount}} tx</span>
  </header>

  {{if .Message}}<div class="flash ok" role="status">{{.Message}}<button class="flash-close" aria-label="Dismiss">×</button></div>{{end}}
  {{if .Error}}<div class="flash err" role="alert">{{.Error}}<button class="flash-close" aria-label="Dismiss">×</button></div>{{end}}

  <main>
    {{template "content" .}}
  </main>
  <footer class="footer muted">
    <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · fynanz
  </footer>
</body>
</html>
