<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · fynanz</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">fynanz</a>
    <nav>
      <a href="/"><span class="nav-full">Dashboard</span><span class="nav-short mono">Db</span></a>
      <a href="/transactions"><span class="nav-full">Transactions</span><span class="nav-short mono">Tx</span></a>
      <a href="/inbox"><span class="nav-full">Inbox</span><span class="nav-short mono">Ib</span>{{if .UncategorizedN}} <span class="badge-count" id="uncat-badge">{{.UncategorizedN}}</span>{{end}}</a>
      <a href="/categories"><span class="nav-full">Categories</span><span class="nav-short mono">Ct</span></a>
      <a href="/settings"><span class="nav-full">Settings</span><span class="nav-short mono">St</span></a>
    </nav>
    <span class="count">{{.TxCount}} tx</span>
  </header>

  {{if .Message}}<div class="flash ok">{{.Message}}</div>{{end}}
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}

  <main>
    {{template "content" .}}
  </main>
</body>
</html>
